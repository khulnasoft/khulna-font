name: Font Request
description: Request a new glyph, weight, or script support
labels: [font-request]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What glyph, weight, script, or feature do you need?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: How would you use this?